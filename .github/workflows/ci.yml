name: HànPath CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: hanpath-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Print Node and npm version
        run: |
          node -v
          npm -v
      - name: Install dependencies (clean lockfile)
        run: npm ci
      - name: Run verification checks (lint, typecheck, unit tests, build)
        run: npm run check
      - name: Verify production bundle size budget
        run: npm run check:bundle
      - name: Run coverage analysis
        run: npm run test:coverage
      - name: Security audit
        run: npm audit --audit-level=high
