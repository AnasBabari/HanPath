# .gitlab-ci.yml — retired legacy pipeline
#
# GitHub Actions (.github/workflows/ci.yml) is the authoritative CI path. This
# file is intentionally disabled so an old GitLab integration cannot run the
# placeholder deploy jobs below or publish an unreviewed image.

workflow:
  rules:
    - when: never

image: node:20-alpine

variables:
  DOCKER_DRIVER: overlay2
  FF_USE_FASTZIP: "true"
  FASTZIP_COMPRESSION_LEVEL: "fast"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  RELEASE_IMAGE: $CI_REGISTRY_IMAGE:latest

stages:
  - lint
  - test
  - build
  - containerize
  - deploy-staging
  - deploy-prod

# Global cache for Node dependencies
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
  policy: pull-push

# Default rules for pipelines
.default_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# Stage 1: Lint & Static Code Analysis
# -----------------------------------------------------------------------------
lint:code:
  stage: lint
  extends: .default_rules
  script:
    - npm ci --prefer-offline
    - npm run lint
  allow_failure: false

# -----------------------------------------------------------------------------
# Stage 2: Automated Unit Testing
# -----------------------------------------------------------------------------
test:unit:
  stage: test
  extends: .default_rules
  script:
    - npm ci --prefer-offline
    - npx vitest run --reporter=verbose --coverage
  coverage: '/All files\s*\|\s*([\d\.]+)/'
  artifacts:
    name: "test-report-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - coverage/
    reports:
      junit: junit.xml

# -----------------------------------------------------------------------------
# Stage 3: Production Build
# -----------------------------------------------------------------------------
build:app:
  stage: build
  extends: .default_rules
  script:
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    name: "dist-$CI_COMMIT_REF_SLUG"
    expire_in: 7 days
    paths:
      - dist/

# -----------------------------------------------------------------------------
# Stage 4: Containerization (Docker Build & Push to GitLab Registry)
# -----------------------------------------------------------------------------
docker:build:
  stage: containerize
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - build:app
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag $IMAGE_TAG $RELEASE_IMAGE
        docker push $RELEASE_IMAGE
      fi

# -----------------------------------------------------------------------------
# Stage 5: Staging & Review App Deployment
# -----------------------------------------------------------------------------
deploy:staging:
  stage: deploy-staging
  environment:
    name: staging
    url: https://staging.hanpath.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - docker:build
  script:
    - echo "Deploying HànPath to Staging Environment ($IMAGE_TAG)..."
    # Deployment script / webhook call goes here

# -----------------------------------------------------------------------------
# Stage 6: Production Deployment
# -----------------------------------------------------------------------------
deploy:production:
  stage: deploy-prod
  environment:
    name: production
    url: https://hanpath.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
  needs:
    - docker:build
  script:
    - echo "Deploying HànPath to Production ($RELEASE_IMAGE)..."
    # Production deployment script / Kubernetes rollout goes here
